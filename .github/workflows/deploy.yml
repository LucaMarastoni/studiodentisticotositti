name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_DEPLOY_ENV: preview
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check, build and upload Pages artifact
        uses: withastro/action@v6
        with:
          node-version: '22.23.4'
          build-cmd: npm run check && npm run build && npm run verify

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
